# RenGL packaging settings for this project. Build with package.cmd, in this folder.
# Lines starting with # are comments, and a setting with nothing after the = is ignored.
# A parameter on the command line wins over this file: package.cmd -Platform linux-x64

# The app's name, which is also the name of its launcher (MyApp.exe).
name=OpenZip

# The class with the main method, package included.
mainClass=me.piitex.openzip.OpenZip
version=1.0

# What to build: windows-x64, linux-x64, linux-arm64, macos-x64, macos-arm64, or all (comma separated).
# Each platform other than this one downloads its Java modules the first time (about 85 MB each).
platform=all

# false: a .zip and .tar.gz per platform.
# true: a setup.exe for Windows (with a RenGL window) and a .deb for Linux, instead.
# plain: the same, with the small plain Windows window in the setup (about 50 MB smaller).
installer=true

# More settings, if you want them. Remove the # to use one.
# The Windows, Linux and macOS icons. The macOS one is made from a square 1024 px png.
icon=packaging\icons\OpenZip.ico,packaging\icons\OpenZip.png,icns=packaging\icons\OpenZip-macos-1024.png
vendor=OpenZip
description=A free archive utility
# The macOS Finder action opens the app by this id (FinderAction.BUNDLE_ID); it also names the Windows uninstall entry.
identifier=me.piitex.openzip
# A folder of files to ship beside the jars (assets, default data).
# content=assets
# Java modules the app loads by reflection, which the packager cannot see.
addModules=java.logging,java.prefs

# The archive types. The Windows setup adds OpenZip to each type's Open with list; macOS gets document types from the
# file below instead (the system's own zip and tar types at Alternate rank, so Finder offers OpenZip without taking over
# from Archive Utility).
fileAssociation=zip,application/zip,Zip archive
fileAssociation=7z,application/x-7z-compressed,7-Zip archive
fileAssociation=rar,application/vnd.rar,RAR archive
fileAssociation=tar,application/x-tar,Tar archive
fileAssociation=tgz,application/gzip,Gzip-compressed tar archive
fileAssociation=txz,application/x-xz,XZ-compressed tar archive
fileAssociation=tbz2,application/x-bzip2,Bzip2-compressed tar archive
# Windows goes by the last extension only, so foo.tar.gz is a .gz, foo.tar.xz an .xz and foo.tar.bz2 a .bz2.
fileAssociation=gz,application/gzip,Gzip-compressed file
fileAssociation=xz,application/x-xz,XZ-compressed file
fileAssociation=bz2,application/x-bzip2,Bzip2-compressed file
documentTypes=packaging\document-types.plist

# Explorer's right-click menu, written by the Windows setup and removed by its uninstaller. Explorer sorts the entries of
# a target by key name, hence Compress1Zip before Compress2Options. On Windows 11 they are under Show more options.
shellVerb=.zip|OpenZip.Open|Open with OpenZip|"%1"
shellVerb=.7z|OpenZip.Open|Open with OpenZip|"%1"
shellVerb=.rar|OpenZip.Open|Open with OpenZip|"%1"
shellVerb=.tar|OpenZip.Open|Open with OpenZip|"%1"
shellVerb=.tgz|OpenZip.Open|Open with OpenZip|"%1"
shellVerb=.txz|OpenZip.Open|Open with OpenZip|"%1"
shellVerb=.tbz2|OpenZip.Open|Open with OpenZip|"%1"
shellVerb=.tbz|OpenZip.Open|Open with OpenZip|"%1"
shellVerb=.gz|OpenZip.Open|Open with OpenZip|"%1"
shellVerb=.xz|OpenZip.Open|Open with OpenZip|"%1"
shellVerb=.bz2|OpenZip.Open|Open with OpenZip|"%1"
shellVerb=.cbr|OpenZip.Open|Open with OpenZip|"%1"
shellVerb=Directory|OpenZip.Compress1Zip|Compress to ZIP|--compress=zip "%1"
shellVerb=Directory|OpenZip.Compress2Options|Compress with OpenZip...|"%1"
